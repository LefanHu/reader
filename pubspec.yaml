name: reader
description: "A quiet reading room for phone and tablet."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.6
  file_picker: ^13.1.0
  flureadium: ^0.19.3
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/DMSans-OFL.txt
    - THIRD_PARTY_NOTICES.md
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf

name: reader
description: "A quiet reading room for phone and tablet."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.3.0
  crypto: ^3.0.6
  file_picker: ^13.1.0
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flureadium: ^0.19.3
  flutter:
    sdk: flutter
  html: ^0.15.7
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/DMSans-OFL.txt
    - THIRD_PARTY_NOTICES.md
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
